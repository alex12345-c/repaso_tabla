<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla repasoaa</title>
    <style>
        table{
            border: 1px solid;
        }

        td{
            border: 1px black solid;
            padding: 10px;
        }

        th{
            border: 1px solid;
            background-color: yellow;
            color: black;
            padding: 10px;
        }

        .a1{
            text-align: center;
            padding: 10px;
        }

        .a2{
            background-color: red;
            color: white;
            padding: 10px;
            text-align: center;
        }

        .a3{
            text-align: center;
            padding: 10px;
        }
        
        .a4{
            text-align: center;
            padding: 10px;
        }


    </style>
</head>
<body>

    <h1>Tabla de repaso</h1>

    <table>
        <caption>Y tercero... el madrid : </caption>

        <thead>
            <tr>
                <th class="a4" colspan="4">Buenos dias</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="a1" colspan="2">lo</td>
                <td colspan="4">primero</td>
            </tr>
            <tr>
                <td colspan="1">lo</td>
                <td class="a3" colspan="3">segundo</td>
            </tr>
            
        </tbody>
        <tfoot>
            <tr>
                <td rowspan="4">el</td>
                <td class="a2" colspan="6">Atlético</td>
            </tr>
            <tr>

            </tr>
        </tfoot>
    </table>
    
</body>
</html>
